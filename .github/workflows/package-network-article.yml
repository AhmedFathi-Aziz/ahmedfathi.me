name: Package networking article
on:
  push:
    branches: [network-web-request]
    paths: ['.github/workflows/package-network-article.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/import_web_request.py
      - uses: actions/upload-artifact@v4
        with:
          name: networking-article
          path: |
            public/articles/web-request.html
            public/articles/web-request/
